<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Slapstick Showdown 2026</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #ffdeb4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #ff4757;
            text-shadow: 3px 3px 0px #2f3542;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        #game-container {
            width: 600px;
            background: #ffffff;
            border: 6px solid #2f3542;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 8px 8px 0px #2f3542;
            text-align: center;
        }

        .battlefield {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 200px;
            margin-bottom: 20px;
            background: #eccc68;
            border: 4px solid #2f3542;
            border-radius: 10px;
            position: relative;
            padding: 10px;
        }

        .fighter {
            font-size: 5rem;
            transition: transform 0.2s ease-in-out;
            position: relative;
        }

        .hp-bar-container {
            width: 120px;
            background-color: #ddd;
            border: 3px solid #2f3542;
            border-radius: 10px;
            overflow: hidden;
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .hp-bar {
            height: 15px;
            background-color: #2ed573;
            width: 100%;
            transition: width 0.3s ease;
        }

        .character-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .name {
            font-weight: bold;
            color: #2f3542;
            margin-top: 5px;
        }

        #log {
            height: 80px;
            background: #f1f2f6;
            border: 3px solid #2f3542;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            font-size: 1.1rem;
            color: #57606f;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-around;
        }

        button {
            background-color: #ff6b81;
            color: white;
            border: 3px solid #2f3542;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 4px 4px 0px #2f3542;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:hover {
            background-color: #ff4757;
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #2f3542;
        }

        button:disabled {
            background-color: #ced6e0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Animações Tochas */
        .attack-left {
            transform: translateX(50px) scaleX(-1) rotate(15deg);
        }

        .attack-right {
            transform: translateX(-50px) rotate(-15deg);
        }

        .hit {
            animation: shake 0.3s;
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(0px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(2px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(2px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }
    </style>
</head>

<body>

    <h1>cartoon slapfight! 🥊</h1>

    <div id="game-container">
        <div class="battlefield">
            <div class="character-wrapper">
                <div class="hp-bar-container">
                    <div id="player-hp" class="hp-bar"></div>
                </div>
                <div id="player" class="fighter">🦦</div>
                <div class="name">Capivara Elegante</div>
            </div>

            <div class="character-wrapper">
                <div class="hp-bar-container">
                    <div id="enemy-hp" class="hp-bar"></div>
                </div>
                <div id="enemy" class="fighter">🐦</div>
                <div class="name">Pombo Reclamão</div>
            </div>
        </div>

        <div id="log">A batalha cômica começou! Escolha seu golpe absurdo...</div>

        <div class="controls">
            <button onclick="playTurn('tickle')">🪶 Ataque de Cócegas</button>
            <button onclick="playTurn('stare')">👁️ Olhar Julgador</button>
            <button onclick="playTurn('pie')">🥧 Arremesso de Torta</button>
        </div>
    </div>

    <script>
        let playerHp = 100;
        let enemyHp = 100;
        const logDiv = document.getElementById('log');

        const enemyMoves = [
            { name: "jogou uma casca de banana", damage: 12, text: "O Pombo jogou uma casca de banana! Você escorregou feio. 😂" },
            { name: "fez fofoca", damage: 8, text: "O Pombo contou um segredo seu para o bairro. Dano moral! 🤫" },
            { name: "invocou o bando", damage: 20, text: "Uma revoada de pombos passou roubando suas batatas fritas! 🍟" }
        ];

        function updateLog(text) {
            logDiv.innerHTML = text;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateHp() {
            document.getElementById('player-hp').style.width = playerHp + '%';
            document.getElementById('enemy-hp').style.width = enemyHp + '%';

            if (playerHp <= 0) {
                updateLog("💥 <b>Fim de jogo!</b> Você foi derrotado pelo Pombo Reclamão. Mais sorte na próxima!");
                disableButtons();
            } else if (enemyHp <= 0) {
                updateLog("🏆 <b>Vitória Humilhante!</b> O Pombo voou para longe chorando. Você é o rei do desenho animado!");
                disableButtons();
            }
        }

        function disableButtons() {
            document.querySelectorAll('.controls button').forEach(b => b.disabled = true);
        }

        function playTurn(playerChoice) {
            if (playerHp <= 0 || enemyHp <= 0) return;

            const playerEl = document.getElementById('player');
            const enemyEl = document.getElementById('enemy');

            // 1. ATAQUE DO JOGADOR
            playerEl.classList.add('attack-left');
            setTimeout(() => playerEl.classList.remove('attack-left'), 200);

            let dmgToEnemy = 0;
            let playerText = "";

            if (playerChoice === 'tickle') {
                dmgToEnemy = Math.floor(Math.random() * 8) + 8;
                playerText = `Você fez cócegas com uma pena no Pombo. Ele riu tanto que perdeu ${dmgToEnemy} de vida!`;
            } else if (playerChoice === 'stare') {
                dmgToEnemy = Math.floor(Math.random() * 15) + 5;
                playerText = `Você encarou o Pombo com um monóculo julgador. Ele se sentiu socialmente desajeitado e perdeu ${dmgToEnemy} de vida.`;
            } else if (playerChoice === 'pie') {
                if (Math.random() > 0.3) {
                    dmgToEnemy = 25;
                    playerText = `SPLAT! Uma torta de climão acertou em cheio a cara do Pombo! Dano massivo de ${dmgToEnemy}!`;
                } else {
                    playerHp -= 10;
                    playerText = `Errrrrrou! A torta voltou na sua própria cara! Você perdeu 10 de vida pelo mico.`;
                    playerEl.classList.add('hit');
                    setTimeout(() => playerEl.classList.remove('hit'), 300);
                }
            }

            enemyHp = Math.max(0, enemyHp - dmgToEnemy);
            if (dmgToEnemy > 0) {
                enemyEl.classList.add('hit');
                setTimeout(() => enemyEl.classList.remove('hit'), 300);
            }

            updateHp();

            // Se o inimigo não morreu, ele contra-ataca após 1 segundo
            if (enemyHp > 0) {
                disableButtons();
                updateLog(playerText + "<br><i>O Pombo está tramando algo...</i>");

                setTimeout(() => {
                    enemyEl.classList.add('attack-right');
                    setTimeout(() => enemyEl.classList.remove('attack-right'), 200);

                    const move = enemyMoves[Math.floor(Math.random() * enemyMoves.length)];
                    playerHp = Math.max(0, playerHp - move.damage);

                    playerEl.classList.add('hit');
                    setTimeout(() => playerEl.classList.remove('hit'), 300);

                    updateHp();

                    if (playerHp > 0) {
                        updateLog(`${playerText}<br><br>🤖 ${move.text}`);
                        document.querySelectorAll('.controls button').forEach(b => b.disabled = false);
                    }
                }, 1000);
            } else {
                updateLog(playerText);
            }
        }
    </script>
</body>

</html>
